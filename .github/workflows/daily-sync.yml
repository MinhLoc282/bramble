
name: Daily Knowledge Sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-knowledge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare persistent state and logs
        run: |
          mkdir -p .sync-state logs

      - name: Build Docker image
        run: docker build -t daily-knowledge-sync .

      - name: Run daily sync
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VECTOR_STORE_ID: ${{ secrets.OPENAI_VECTOR_STORE_ID }}
        run: |
          docker run --rm \
            -e OPENAI_API_KEY \
            -e OPENAI_VECTOR_STORE_ID \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.sync-state,target=/app/state" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/logs,target=/app/logs" \
            daily-knowledge-sync

      - name: Save sync manifest
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .sync-state/sync_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update knowledge sync manifest"
            git push
          else
            echo "Sync manifest unchanged."
          fi

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sync-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30